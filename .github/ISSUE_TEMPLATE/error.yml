name: "🐛 Informar de un error"
description: Describe un fallo reproducible sin datos privados.
title: "[Error] "
body:
  - type: textarea
    id: descripcion
    attributes:
      label: Qué ocurre
      description: Explica el resultado actual y el esperado.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
    validations:
      required: true
  - type: input
    id: entorno
    attributes:
      label: Entorno y versión
      placeholder: Sistema operativo, navegador o versión de la aplicación
  - type: textarea
    id: adjuntos
    attributes:
      label: Capturas o registros
      description: Elimina claves, correos y cualquier dato personal antes de adjuntar.

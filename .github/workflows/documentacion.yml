name: Comprobar documentación
on:
  push:
    paths:
      - '**/*.md'
      - 'docs/**'
      - 'scripts/comprobar_documentacion.py'
      - '.github/workflows/documentacion.yml'
  pull_request:
    paths:
      - '**/*.md'
      - 'docs/**'
      - 'scripts/comprobar_documentacion.py'
      - '.github/workflows/documentacion.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  enlaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Comprobar enlaces y archivos locales
        run: python3 scripts/comprobar_documentacion.py
